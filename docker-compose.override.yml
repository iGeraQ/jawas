services:
  fetcher:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src
    command: >
      python -m watchfiles --filter python
      "python -m src.fetcher.main"
      src/fetcher src/shared

  enricher:
    build:
      context: .
